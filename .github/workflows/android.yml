name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, lint and debug builds
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Enable Gradle wrapper
        run: chmod +x gradlew

      # A first attempt may fail on a slow or flaky runner while downloading the
      # Gradle distribution or Android SDK packages, so retry once before
      # declaring the job failed.
      - name: Run unit tests, lint and debug builds
        run: |
          set -o pipefail
          for attempt in 1 2; do
            ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace && exit 0
            echo "Attempt ${attempt} failed." >&2
            if [ "${attempt}" = "2" ]; then
              exit 1
            fi
            sleep 30
          done

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
